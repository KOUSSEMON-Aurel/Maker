<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE2CF"/>
      <stop offset="100%" stop-color="#E8BA9F"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <g filter="url(#softShadow)">
    
    <!-- Shoulders & Torso -->
    <path d="M 120 420 Q 250 395 380 420 L 410 550 L 90 550 Z" 
          fill="url(#hoodieGrad)" stroke="#181B20" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Chest / Zip folds -->
    <path d="M 250 435 L 250 550" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 480 Q 210 495 240 485" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 330 480 Q 290 495 260 485" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Hood Collar Behind Neck -->
    <path d="M 175 350 C 145 380 160 440 250 440 C 340 440 355 380 325 350 Z" 
          fill="#1E3A8A" stroke="#181B20" stroke-width="4"/>

    <!-- White Drawstrings -->
    <path d="M 215 425 Q 210 480 215 505" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <rect x="212" y="505" width="6" height="12" rx="3" fill="#CBD5E1"/>
    <path d="M 285 425 Q 290 480 285 505" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <rect x="282" y="505" width="6" height="12" rx="3" fill="#CBD5E1"/>
    
    <!-- Neck -->
    <path d="M 220 330 L 220 380 Q 250 395 280 380 L 280 330 Z" fill="#E8BA9F" stroke="#181B20" stroke-width="4"/>

    <!-- Ears -->
    <path d="M 162 255 C 145 255 145 295 165 295 Z" fill="#FFE2CF" stroke="#181B20" stroke-width="4"/>
    <path d="M 158 270 Q 152 280 160 285" stroke="#E8BA9F" stroke-width="3" fill="none"/>
    <path d="M 338 255 C 355 255 355 295 335 295 Z" fill="#FFE2CF" stroke="#181B20" stroke-width="4"/>
    <path d="M 342 270 Q 348 280 340 285" stroke="#E8BA9F" stroke-width="3" fill="none"/>

    <!-- Face Shape (Anime soft jaw) -->
    <path d="M 165 240 C 165 170 335 170 335 240 C 335 310 295 355 250 355 C 205 355 165 310 165 240 Z" 
          fill="url(#skinGrad)" stroke="#181B20" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Nose -->
    <path d="M 248 270 L 253 277 L 247 280" stroke="#181B20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Hair Base & Dynamic Tuft Layers -->
    <path d="M 155 240 C 145 150 200 115 250 115 C 310 115 355 150 345 240 C 355 220 358 190 340 165 C 320 140 300 130 250 130 C 190 130 170 150 155 240 Z"
          fill="#271E18" stroke="#181B20" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Top Hair Volume & Spikes -->
    <path d="M 160 220 C 150 160 190 110 255 110 C 320 110 355 155 342 215 C 335 170 310 130 260 130 C 200 130 175 165 160 220 Z" 
          fill="#4E3C32"/>

    <!-- Front Strands / Fringe -->
    <path d="M 168 205 Q 185 240 205 220 Q 225 250 250 215 Q 275 250 295 218 Q 320 235 332 205 C 325 160 300 140 250 140 C 195 140 175 165 168 205 Z"
          fill="#271E18" stroke="#181B20" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Accent Highlight Lock -->
    <path d="M 215 150 Q 240 135 270 145" stroke="#4E3C32" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Angled Angry Brows -->
    <path d="M 185 215 L 230 230" stroke="#181B20" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 315 215 L 270 230" stroke="#181B20" stroke-width="5.5" stroke-linecap="round"/>

    <ellipse cx="205" cy="245" rx="15" ry="16" fill="#FFFFFF" stroke="#181B20" stroke-width="4"/>
    <circle cx="208" cy="245" r="6" fill="#0284C7"/>
    <circle cx="208" cy="245" r="3.5" fill="#1E293B"/>

    <ellipse cx="295" cy="245" rx="15" ry="16" fill="#FFFFFF" stroke="#181B20" stroke-width="4"/>
    <circle cx="292" cy="245" r="6" fill="#0284C7"/>
    <circle cx="292" cy="245" r="3.5" fill="#1E293B"/>

    <!-- Clenched Teeth Mouth -->
    <rect x="225" y="295" width="50" height="16" rx="6" fill="#FFFFFF" stroke="#181B20" stroke-width="3.5"/>
    <line x1="225" y1="303" x2="275" y2="303" stroke="#181B20" stroke-width="2"/>
    <line x1="242" y1="295" x2="242" y2="311" stroke="#181B20" stroke-width="2"/>
    <line x1="258" y1="295" x2="258" y2="311" stroke="#181B20" stroke-width="2"/>

    <!-- Anime Anger Mark 💢 -->
    <path d="M 335 160 L 355 160 M 345 150 L 345 170" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
    
  </g>
</svg>